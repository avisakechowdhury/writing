name: WriteAnon Keep-Alive

on:
  schedule:
    # Runs every 10 minutes
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          # CRITICAL: This must match the name you saved in GitHub Secrets
          PING_URL: ${{ secrets.WRITEANON_HEALTHCHECK }}
        run: |
          if [ -z "$PING_URL" ]; then
            echo "❌ ERROR: Secret 'WRITEANON_HEALTHCHECK' is missing!"
            echo "Go to Settings > Secrets and variables > Actions to add it."
            exit 1
          fi
          
          echo "🚀 Pinging WriteAnon health endpoint..."
          
          # -f: Fail on server error
          # -sS: Silent but show errors
          # --retry 3: Try again if it fails (great for free-tier wakeups)
          # --connect-timeout 10: Don't hang forever
          curl -fsS --retry 3 --retry-delay 5 --connect-timeout 10 "$PING_URL" > /dev/null
          
          echo "✅ Ping successful. Service is awake!"
