name: Keep Render Service Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          PING_URL: ${{ secrets.RENDER_HEALTHCHECK_URL }}
        run: |
          if [ -z "$PING_URL" ]; then
            echo "Missing secret RENDER_HEALTHCHECK_URL"
            exit 1
          fi
          curl -fsS "$PING_URL" >/dev/null

