name: Render Keep-Alive

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch: 

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping WriteAnon Healthcheck
        run: curl -s ${{ secrets.WRITEANON_HEALTHCHECK }} > /dev/null
